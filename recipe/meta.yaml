{% set name = "xprof" %}
{% set version = "2.23.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # built from source per AR policy (no PyPI wheel repacks, 2026-09-11);
  # tag xprof-v{{ version }} -> commit db2de2a458be5eb2c14060f1c091c0a5b14bfb62
  url: https://github.com/openxla/{{ name }}/archive/refs/tags/{{ name }}-v{{ version }}.tar.gz
  sha256: d57d365e71b70537f69c901c66e0f5cc4f07c7f778e4214c955c703f622d9963
  patches:
    # fixes to bazel external repos for conda toolchains (see patch header):
    # rules_nodejs arch detection via rctx.os.arch, and gRPC's protoc plugin
    # kept single-arch on macOS
    - patches/0001-bazel-external-repo-fixes.patch

build:
  # build 1 supersedes the wheel-repack build 0 with a from-source rebuild
  number: 1
  # WIN-64 FROM-SOURCE SPIKE (PKG-18061): this branch builds win-64 ONLY —
  # linux-64/osx-arm64 are temporarily skipped here to keep CI light while the
  # bazel-on-Windows build is brought up. The full linux+osx matrix lives in the
  # from-source PR (PKG-17979); fold win-64 back into that skip line before merge.
  skip: true  # [py<310 or not win64]
  # conda-build's post-build byte-compile runs under the build-env python (3.14)
  # and would add foreign-version .pyc; skip it so only pip's variant-python
  # bytecode ships
  skip_compile_pyc:
    - "**/*.py"
  entry_points:
    - xprof = xprof.cli.xprof_cli:main

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - bazel 7.*
    # provides gen-bazel-toolchain (conda-compiler crosstool for bazel) — linux/osx
    # only; no win-64 build exists, so on Windows we drive upstream's own
    # --config=windows clang toolchain instead (see bld.bat)
    - bazel-toolchain >=0.2.0b1  # [not win]
    # uname/cp used by rules_nodejs arch detection and plugin/build_pip_package.sh;
    # on Windows the same tools come from m2-coreutils under bazel's MSYS bash
    - coreutils  # [not win]
    # bazel on Windows shells out to bash for def-file/genrule actions; point
    # BAZEL_SH at msys2-bash in bld.bat (jaxlib-feedstock pattern)
    - msys2-bash        # [win]
    - msys2-coreutils   # [win]
    - msys2-sed         # [win]
    # repair RPATH of bazel's extracted helper binaries (see build.sh)
    - patchelf  # [linux]
    # xprof's build:windows config compiles with clang-cl, not cl.exe; supply
    # conda clang and point BAZEL_LLVM/CLANG_COMPILER_PATH at it in bld.bat
    - clangdev 22.*  # [win]
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - absl-py >=2.1.0
    - gviz-api >=1.9.0
    - protobuf >=3.19.6
    - setuptools >=41.0.0
    - six >=1.10.0
    - werkzeug >=0.11.15
    - etils >=1.0.0
    # etils[epath] extra expands to:
    - fsspec >=2024.3.1
    - typing_extensions
    - zipp
    # etils <1.13 (the last py3.10-compatible series on pkgs/main) additionally
    # requires importlib_resources in its epath extra
    - importlib_resources  # [py<311]
    - cheroot >=10.0.1
    - gcsfs >=2024.3.1
    - google-cloud-storage >=3.12.0
    - urllib3 >=2.7.0
    - fire >=0.4.0

test:
  requires:
    - pip
  imports:
    - xprof
    # loads the locally-built native trace-processing library
    - xprof.convert._pywrap_profiler_plugin
  commands:
    - pip check
    - xprof --help

about:
  home: https://github.com/openxla/xprof
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: XProf Profiler Plugin
  description: |
    XProf (formerly the TensorBoard profile plugin) offers a suite of tools
    for understanding and optimizing the performance of machine learning
    workloads on CPUs, GPUs and TPUs. It analyzes profiles captured from
    JAX, TensorFlow and PyTorch/XLA, and can run standalone via the xprof
    CLI or as a TensorBoard plugin.
  doc_url: https://openxla.org/xprof
  dev_url: https://github.com/openxla/xprof

extra:
  skip-lints:
    # setuptools >=41.0.0 is a declared upstream runtime requirement
    # (install_requires in plugin/setup.py); it belongs in run, not host
    - python_build_tools_in_host
